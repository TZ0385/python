rationale_en: Reactive, pure-Python notebook stored as standard executable .py files
  with deterministic state execution.
rationale_zh: 响应式纯 Python 笔记本，以标准可执行 .py 文件保存，状态执行具有
  确定性。
when_not_to_use_en: When your workflow depends on Jupyter-only extensions, or
  kernel-state debugging is central to your process.
when_not_to_use_zh: 工作流依赖 Jupyter 专属扩展，或内核状态调试是核心流程时。
risk_en: Requires a modern browser environment and replaces the Jupyter workflow
  rather than extending it.
risk_zh: 需要现代浏览器环境；它是 Jupyter 工作流的替代而非扩展。
